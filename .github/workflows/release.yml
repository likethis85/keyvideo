name: 'Publish Tauri Desktop Apps'

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm ci

      - name: verify frontend
        run: npm test

      - name: verify production backend uses HTTPS
        shell: bash
        env:
          BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
        run: |
          if [[ -z "${BACKEND_URL}" ]]; then
            echo "::error::Repository variable VITE_BACKEND_URL is required for production builds."
            exit 1
          fi
          if [[ "${BACKEND_URL}" != https://* ]]; then
            echo "::error::VITE_BACKEND_URL must use HTTPS (got: ${BACKEND_URL})."
            exit 1
          fi
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git "203.205.89.231" src src-tauri 2>/dev/null; then
            echo "::error::A hard-coded HTTP backend address remains in the release sources."
            exit 1
          fi

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'KeyVideo v__VERSION__'
          releaseBody: 'KeyVideo 桌面端自动构建发布。包含 Windows 和 macOS 安装包。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

