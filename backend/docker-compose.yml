services:
  keyvideo-backend:
    build: .
    container_name: keyvideo-backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    volumes:
      - keyvideo-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  keyvideo-data:
